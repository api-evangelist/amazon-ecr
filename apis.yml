name: Amazon ECR
description: Amazon Elastic Container Registry (ECR) is a fully managed container registry that makes
  it easy to store, manage, share, and deploy container images and artifacts. ECR eliminates the need
  to operate your own container repositories or worry about scaling the underlying infrastructure, and
  integrates with Amazon ECS and Amazon EKS for simplified development to production workflows.
