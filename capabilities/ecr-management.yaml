naftiko: 1.0.0-alpha2
info:
  label: Amazon ECR Container Registry Management
  description: Unified capability for managing ECR repositories, container images, and lifecycle policies for DevOps engineers.
  tags:
  - Amazon ECR
  - AWS
  - Containers
  - Container Registry
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
  - type: http
    namespace: ecr
    baseUri: https://api.ecr.us-east-1.amazonaws.com
    description: Amazon ECR fully managed container registry.
    authentication:
      type: apikey
      key: Authorization
      value: AWS4-HMAC-SHA256 Credential={{env.AWS_ACCESS_KEY_ID}}
      placement: header
    resources:
    - name: root
      path: /
      description: Operations for root resources.
      operations:
      - name: createRepository
        method: POST
        description: Amazon ECR Create Repository
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
          description: The X-Amz-Target parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: null
      path: /#DescribeRepositories
      description: 'Operations for #DescribeRepositories resources.'
      operations:
      - name: describeRepositories
        method: POST
        description: Amazon ECR Describe Repositories
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
          description: The X-Amz-Target parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: null
      path: /#DeleteRepository
      description: 'Operations for #DeleteRepository resources.'
      operations:
      - name: deleteRepository
        method: POST
        description: Amazon ECR Delete Repository
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
          description: The X-Amz-Target parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: null
      path: /#PutImage
      description: 'Operations for #PutImage resources.'
      operations:
      - name: putImage
        method: POST
        description: Amazon ECR Put Image
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
          description: The X-Amz-Target parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: null
      path: /#BatchGetImage
      description: 'Operations for #BatchGetImage resources.'
      operations:
      - name: batchGetImage
        method: POST
        description: Amazon ECR Batch Get Image
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
          description: The X-Amz-Target parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: null
      path: /#ListImages
      description: 'Operations for #ListImages resources.'
      operations:
      - name: listImages
        method: POST
        description: Amazon ECR List Images
        inputParameters:
        - name: X-Amz-Target
          in: header
          type: string
          required: true
          description: The X-Amz-Target parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8084
    namespace: ecr-api
    description: Unified REST API for Container Registry Management.
    resources:
    - path: /v1/resource
      name: createRepository
      description: Amazon ECR Create Repository
      operations:
      - method: POST
        name: createRepository
        description: Amazon ECR Create Repository
        call: ecr.createRepository
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/#DescribeRepositories
      name: describeRepositories
      description: Amazon ECR Describe Repositories
      operations:
      - method: POST
        name: describeRepositories
        description: Amazon ECR Describe Repositories
        call: ecr.describeRepositories
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/#DeleteRepository
      name: deleteRepository
      description: Amazon ECR Delete Repository
      operations:
      - method: POST
        name: deleteRepository
        description: Amazon ECR Delete Repository
        call: ecr.deleteRepository
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/#PutImage
      name: putImage
      description: Amazon ECR Put Image
      operations:
      - method: POST
        name: putImage
        description: Amazon ECR Put Image
        call: ecr.putImage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/#BatchGetImage
      name: batchGetImage
      description: Amazon ECR Batch Get Image
      operations:
      - method: POST
        name: batchGetImage
        description: Amazon ECR Batch Get Image
        call: ecr.batchGetImage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/#ListImages
      name: listImages
      description: Amazon ECR List Images
      operations:
      - method: POST
        name: listImages
        description: Amazon ECR List Images
        call: ecr.listImages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9094
    namespace: ecr-mcp
    transport: http
    description: MCP server for AI-assisted Container Registry Management.
    tools:
    - name: create-repository
      description: Amazon ECR Create Repository
      hints:
        readOnly: false
        destructive: false
      call: ecr.createRepository
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-repositories
      description: Amazon ECR Describe Repositories
      hints:
        readOnly: false
        destructive: false
      call: ecr.describeRepositories
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-repository
      description: Amazon ECR Delete Repository
      hints:
        readOnly: false
        destructive: false
      call: ecr.deleteRepository
      outputParameters:
      - type: object
        mapping: $.
    - name: put-image
      description: Amazon ECR Put Image
      hints:
        readOnly: false
        destructive: false
      call: ecr.putImage
      outputParameters:
      - type: object
        mapping: $.
    - name: batch-get-image
      description: Amazon ECR Batch Get Image
      hints:
        readOnly: false
        destructive: false
      call: ecr.batchGetImage
      outputParameters:
      - type: object
        mapping: $.
    - name: list-images
      description: Amazon ECR List Images
      hints:
        readOnly: false
        destructive: false
      call: ecr.listImages
      outputParameters:
      - type: object
        mapping: $.
